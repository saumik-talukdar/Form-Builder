services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000

      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}

      JWT_SECRET: ${JWT_SECRET}
      IP_HASH_SECRET: ${IP_HASH_SECRET}

      CORS_ORIGIN: http://localhost:10000
      TRUST_PROXY: "0"

    restart: unless-stopped